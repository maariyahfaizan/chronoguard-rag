# ChronoGuard-RAG -- StreamingQA pool-construction config
# Weeks 3-4 | Gate A
#
# Read by: fetch_wmt_archives.py, build_streamingqa_pools.py,
# preprocess_streamingqa.py. This is the pool-construction config
# (WMT sourcing, gold resolution, candidate window, chunking) -- distinct
# from configs/streamingqa_eval_config.yaml, which covers E1-E4 evaluation
# settings and results and does NOT need any of the keys below.
#
# NOTE: this file was reconstructed after the original interactive Kaggle
# session was lost (see notes on individual keys below for what was
# recovered vs. what is only "the value actually used").

output:
  raw_dir: data/raw
  processed_path: data/processed/streamingqa_control_pools.jsonl
  chunked_path: data/processed/streamingqa_control_pools_chunked.jsonl  # Gate A-2 output

sample:
  seed: 42

candidate_pool:
  candidates_per_query: 20
  # Counted in ORIGINAL-PASSAGE terms (Gate A-2 decision): chunking happens
  # after pool construction, so the chunked pool grows past 20 candidates
  # per query rather than being capped back down. Measured: avg 20.0
  # pre-chunk -> avg 20.7 post-chunk.
  # Matches the convention used project-wide (FreshQA uses 20; TriviaQA is
  # consistent with it) and the eval config's candidate_top_k: 20.
  # Reasonably confident, not certain -- no explicit prior statement of
  # this number for StreamingQA specifically was ever found.

  window_days: 7
  # The value ACTUALLY USED for the real Gate A fetch/pool build (confirmed
  # by the run's own log: "Retention margin: +/-56 days" = 7 * 8). It is
  # NOT a recovered original value -- the original was lost with the
  # interactive session and could not be re-verified. Report it as "7 days
  # (documented default)", not as a recovered fact.

evidence_source:
  base_url: https://data.statmt.org/news-crawl/doc/en/
  filename_pattern: "news-docs.{year}.en.filtered.gz"
  # Both confirmed: base_url's host+path from fetch_wmt_archives.py's own
  # auth setup, filename_pattern quoted from save_snapshot_streamingqa.py.

  sorting_keys_url: "https://storage.googleapis.com/dm-streamingqa/wmt_sorting_key_ids.txt.gz"
  # Confirmed by the real fetch run: the download completed and extraction
  # proceeded through all years using this file.

  years:
    - 2008
    - 2009
    - 2010
    - 2011
    - 2012
    - 2013
    - 2014
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
  # Confirmed directly from the real streamingqa_control_sample.jsonl's
  # evidence_ts values -- 13 years.

chunking:
  # Gate A-2. RECORD of the values used by src/eval/chunk_streamingqa_pools.py.
  # That script currently HARDCODES these constants and does not read this
  # block (YAML-as-source-of-truth is Gate A5, out of scope for now) -- if
  # you change one, change the script too.
  tokenizer: BAAI/bge-reranker-base   # tightest downstream budget (512 tokens shared query+passage)
  target_chunk_tokens: 320            # middle of the 256-384 range
  overlap_tokens: 64
  min_chunk_tokens: 64                # shorter trailing fragments merged into previous chunk
  # Documented assumption, not yet confirmed by supervisor: chunking is a
  # StreamingQA-only step; bm25.py/dense.py/hybrid.py/reranker.py/generate.py
  # are untouched, so TriviaQA and FreshQA results are unaffected.